<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">
<style>
.h{animation:scr .5s ease-in-out infinite alternate}
.dot{animation:blink 1s ease-in-out infinite}
.dot2{animation:blink 1s ease-in-out .5s infinite}
