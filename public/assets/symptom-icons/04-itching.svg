<circle class="dot" cx="20" cy="22" r="3" fill="#1B1464"/>
<circle class="dot2" cx="76" cy="24" r="3" fill="#1B1464"/>
<circle class="dot" cx="48" cy="18" r="3" fill="#1B1464"/>
<circle class="dot2" cx="78" cy="76" r="3" fill="#1B1464"/>
</svg>
